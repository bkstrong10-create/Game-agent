name: Build APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Release signing keystore secret is missing; refusing to publish an unsigned release." >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/gameagent.p12
      - name: Build
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: gameagent.p12
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD" || { echo "Release signing password is missing" >&2; exit 1; }
          gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: GameAgent-release
          path: app/build/outputs/apk/release/app-release.apk
